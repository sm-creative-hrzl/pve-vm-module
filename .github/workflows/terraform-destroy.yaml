name: terraform-destroy

# Manual-only. Destroys the VM. Guarded by an explicit confirmation input and
# an organisation variable so it can never run by accident.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type 'true' to confirm you want to DESTROY the VM"
        required: true
        default: "false"
        type: string

permissions:
  contents: read

# Credentials are sourced from organisation-level variables and secrets
# (sm-creative-hrzl organisation). No environment-level override is needed.
env:
  TF_IN_AUTOMATION: "true"
  TF_VERSION:              ${{ vars.TF_VERSION }}
  TF_VAR_pve_api_url:      ${{ vars.PVE_API_URL }}
  TF_VAR_pve_token_id:     ${{ vars.PVE_TOKEN_ID }}
  TF_VAR_pve_token_secret: ${{ secrets.PVE_TOKEN_SECRET }}
  # MinIO backend credentials
  AWS_ACCESS_KEY_ID:     ${{ vars.MINIO_ACCESS_KEY }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.MINIO_SECRET_KEY }}

jobs:
  destroy:
    # Gate the entire job on the confirmation input.
    if: ${{ inputs.confirm == 'true' }}
    runs-on: [self-hosted]
    steps:
      - name: Verify confirmation
        run: |
          if [[ "${{ inputs.confirm }}" != "true" ]]; then
            echo "Confirmation not provided (expected 'true'). Aborting." >&2
            exit 1
          fi
          if [[ "${{ vars.DESTROY_VM }}" != "true" ]]; then
            echo "Organisation variable DESTROY_VM must be set to 'true' to allow destroy." >&2
            exit 1
          fi
          echo "Confirmation accepted. Proceeding with destroy."

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Terraform
        run: |
          curl -fsSL "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip" -o /tmp/terraform.zip
          python3 -c "import zipfile; zipfile.ZipFile('/tmp/terraform.zip').extractall('/tmp/tf-bin')"
          mkdir -p "$HOME/.local/bin"
          mv /tmp/tf-bin/terraform "$HOME/.local/bin/terraform"
          chmod +x "$HOME/.local/bin/terraform"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          rm -rf /tmp/terraform.zip /tmp/tf-bin

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform destroy
        run: terraform destroy -input=false -auto-approve -no-color -var-file=input.tfvars
