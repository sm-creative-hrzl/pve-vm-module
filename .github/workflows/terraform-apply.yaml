name: terraform-apply

# Runs automatically when terraform-plan completes successfully on any branch,
# or manually via workflow_dispatch.
#
# NOTE: This must run on a runner that can reach the Proxmox API —
# almost always a self-hosted runner in the homelab.

on:
  workflow_run:
    workflows: ["terraform-plan"]
    types: [completed]
  workflow_dispatch:
    inputs:
      var_file:
        description: "Var file to pass to terraform apply (e.g. input.tfvars)"
        required: false
        default: "input.tfvars"
        type: string

# Prevent overlapping applies from racing on the same state.
concurrency:
  group: terraform-apply
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

# Credentials are sourced from organisation-level variables and secrets
# (sm-creative-hrzl organisation). No environment-level override is needed.
env:
  TF_IN_AUTOMATION: "true"
  TF_VERSION: ${{ vars.TF_VERSION }}
  TF_VAR_pve_api_url: ${{ vars.PVE_API_URL }}
  TF_VAR_pve_token_id: ${{ vars.PVE_TOKEN_ID }}
  TF_VAR_pve_token_secret: ${{ secrets.PVE_TOKEN_SECRET }}
  # MinIO backend credentials
  AWS_ACCESS_KEY_ID: ${{ secrets.MINIO_ACCESS_KEY }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.MINIO_SECRET_KEY }}

jobs:
  apply:
    # For workflow_run: only proceed when the plan actually succeeded.
    # For workflow_dispatch: always allow manual runs.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted]
    # Pauses here and waits for a reviewer to approve before any step runs.
    # Configure required reviewers at: Settings → Environments → apply-approval
    environment: apply-approval
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # When triggered by workflow_run, check out the same ref that ran the plan.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Install Terraform
        run: |
          TF_ZIP="terraform_${TF_VERSION}_linux_amd64.zip"
          curl -fsSL -o "/tmp/${TF_ZIP}" \
            "https://releases.hashicorp.com/terraform/${TF_VERSION}/${TF_ZIP}"
          mkdir -p "${HOME}/.local/bin"
          python3 -c "
          import zipfile, sys
          zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])
          " "/tmp/${TF_ZIP}" "${HOME}/.local/bin"
          chmod +x "${HOME}/.local/bin/terraform"
          echo "${HOME}/.local/bin" >> "$GITHUB_PATH"

      - name: Check backend credentials
        run: |
          if [[ -z "${AWS_ACCESS_KEY_ID}" || -z "${AWS_SECRET_ACCESS_KEY}" ]]; then
            echo "Missing MinIO backend credentials. Configure MINIO_ACCESS_KEY and MINIO_SECRET_KEY as organisation variables/secrets." >&2
            exit 1
          fi

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform validate
        run: terraform validate -no-color

      - name: Terraform apply
        run: |
          # inputs.var_file is only set for workflow_dispatch; falls back to input.tfvars otherwise.
          VAR_FILE="${{ inputs.var_file }}"
          if [[ -z "${VAR_FILE}" ]]; then
            VAR_FILE="input.tfvars"
          fi
          EXTRA_ARGS=""
          if [[ -f "${VAR_FILE}" ]]; then
            EXTRA_ARGS="-var-file=${VAR_FILE}"
          fi
          terraform apply -input=false -auto-approve -no-color ${EXTRA_ARGS}
